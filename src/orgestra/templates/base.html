<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Orgestra{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/sse.js" defer></script>
    {% if scene_available %}<script type="module" src="/static/dist/stage.js"></script>{% endif %}
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">Orgestra</a>
      <form action="/" method="get" role="search" class="search">
        <label for="q" class="visually-hidden">Search talks, questions and speakers</label>
        <input id="q"
               type="search"
               name="q"
               value="{{ result.query if result else '' }}"
               placeholder="Ask about a topic, a talk or a speaker"
               autocomplete="off"
               hx-get="/search"
               hx-trigger="input changed delay:300ms, search"
               hx-sync="this:replace"
               hx-target="#main"
               hx-swap="innerHTML"
               hx-push-url="true"
               hx-indicator="#search-busy">
        <span id="search-busy" class="htmx-indicator" aria-hidden="true">Searching…</span>
      </form>
    </header>
    {% include "partials/stage.html" %}
    <div id="app" class="layout" hx-boost="true" hx-target="#main" hx-select="#main" hx-swap="outerHTML">
      {% include "partials/sidebar.html" %}
      <main id="main" class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
