{# The search field with predictions. `live` searches while typing and swaps only #results (on the results
   page); otherwise Enter opens the results page. `hero` is the large field on the home page. #}
{% from "partials/ui.html" import icon %}
<form id="search-form" action="/search" method="get" role="search" class="searchbox{% if hero %} searchbox-hero{% endif %}">
  {{ icon("search", 20, "searchbox-icon") }}
  <label for="q" class="visually-hidden">Search talks, questions and speakers</label>
  <input id="q"
         type="search"
         name="q"
         value="{{ query }}"
         placeholder="Search talks and speakers"
         autocomplete="off"
         autocapitalize="off"
         spellcheck="false"
         enterkeyhint="search"
         role="combobox"
         aria-autocomplete="list"
         aria-haspopup="listbox"
         aria-expanded="false"
         aria-controls="suggestions"
         {% if live %}hx-get="/search" hx-trigger="input changed delay:300ms, search" hx-sync="this:replace" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true" hx-indicator="#search-busy"{% endif %}>
  <span id="search-busy" class="htmx-indicator searchbox-busy" aria-hidden="true"></span>
  <div hidden hx-get="/suggest" hx-trigger="input from:#q delay:150ms" hx-include="#q" hx-target="#suggestions" hx-select="unset" hx-swap="innerHTML"></div>
  <ul id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions" hidden></ul>
</form>
