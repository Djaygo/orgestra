{% from "partials/ui.html" import icon %}
<section class="discussion" id="discussion" hx-swap="outerHTML show:none">
  <h2>
    Discussion <span class="count">{{ posts|sum(attribute="thread_size") }}</span>
  </h2>
  <form class="new-post" method="post" action="/talks/{{ talk.ref }}/posts">
    <label for="new-body" class="visually-hidden">Your comment or question</label>
    <textarea id="new-body" class="input" name="body" rows="2" maxlength="5000" placeholder="Add a comment or ask a question" required></textarea>
    <div class="composer-more">
      <fieldset class="segmented">
        <legend class="visually-hidden">Type</legend>
        <label><input type="radio" name="kind" value="comment" checked><span>Comment</span></label>
        <label><input type="radio" name="kind" value="question"><span>Question</span></label>
      </fieldset>
      <label for="new-name" class="visually-hidden">Your name</label>
      <input id="new-name" class="input" name="name" value="{{ author_name }}" placeholder="Your name" maxlength="40" required>
      <button class="btn" type="submit">Post</button>
    </div>
  </form>
  {% for post in posts %}
    {% include "partials/discussion/post.html" %}
  {% else %}
    <p class="muted discussion-empty">No discussion yet. Ask the first question.</p>
  {% endfor %}
</section>
