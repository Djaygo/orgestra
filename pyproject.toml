[project]
name = "orgestra"
version = "0.1.0"
description = "Search and personas over conference talks and slides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alchemical>=1.0.3",
  "attrs>=25.1",
  "fastapi>=0.115",
  "httpx2>=2.13.1",
  "jinja2>=3.1",
  "pydantic>=2.10",
  "python-multipart>=0.0.32",
  "rapidfuzz>=3.12",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
orgestra = "orgestra.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PTH", "ANN", "S", "ASYNC", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "ANN", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.djlint]
profile = "jinja"
